[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-logistica"
version = "0.1.0"
description = "Optimización logística: diagnóstico del pronóstico, modelo de corrección y Gate de historia mínima"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
]

[project.optional-dependencies]
notebook = ["jupyter", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
desafio-logistica = "desafio_logistica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desafio_logistica = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
